# 岱員時憲章 — CI workflow
# 對 PR 與 push 到 main 分支執行 lint / typecheck / unit test / E2E / build 檢查
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 品質檢查（lint / typecheck / unit test）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Unit test（含覆蓋率報告）
        run: bun run test:coverage

  e2e:
    name: E2E 測試（Playwright）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: E2E（Playwright）
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: SSG 建置（sitemap / hreflang 驗證）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate (SSG)
        run: bun run generate

      - name: 驗證 sitemap_index.xml
        run: |
          test -f .output/public/sitemap_index.xml && echo "✓ sitemap_index.xml 存在" || (echo "✗ sitemap_index.xml 不存在" && exit 1)
          grep -q "taiwan-calendar.pages.dev" .output/public/sitemap_index.xml && echo "✓ sitemap URL 正確" || (echo "✗ sitemap URL 有誤" && exit 1)

      - name: 驗證 hreflang（首頁）
        run: |
          grep -q 'hreflang="zh-Hant-TW"' .output/public/index.html && echo "✓ zh-Hant-TW hreflang" || (echo "✗ zh-Hant-TW hreflang 不存在" && exit 1)
          grep -q 'hreflang="zh-Hans-CN"' .output/public/index.html && echo "✓ zh-Hans-CN hreflang" || (echo "✗ zh-Hans-CN hreflang 不存在" && exit 1)
          grep -q 'hreflang="en"' .output/public/index.html && echo "✓ en hreflang" || (echo "✗ en hreflang 不存在" && exit 1)

      - name: 驗證禁字（防止源碼洩漏）
        run: |
          # 注意：此 workflow 檔本身含禁字 grep 模式，故將 .github/ 排除在外
          ! grep -riE "sxwnl|perpetual-calendar|壽星|翻新" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.nuxt \
            --exclude-dir=.output --exclude-dir=test-results --exclude-dir=.github \
            . 2>/dev/null && echo "✓ 無禁字" || (echo "✗ 發現禁字" && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: 部署到 GitHub Pages
    needs: [e2e, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
